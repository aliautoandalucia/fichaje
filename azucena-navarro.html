<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichaje">
<title>Fichaje · Azucena Navarro</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0d1520; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
    user-select: none;
  }
  .empresa { font-size: 12px; color: #64748b; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; text-align:center; }
  .nombre  { font-size: 26px; font-weight: 800; color: #f5a623; margin-bottom: 4px; text-align:center; }
  .reloj   { font-size: 36px; font-weight: 300; color: #38bdf8; font-variant-numeric: tabular-nums; margin: 16px 0 24px; letter-spacing: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 320px; }
  .btn {
    padding: 20px 10px; border-radius: 14px; border: none;
    font-size: 14px; font-weight: 800; cursor: pointer;
    transition: transform 0.1s, filter 0.1s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .btn:active { transform: scale(0.95); filter: brightness(0.85); }
  .btn .icon { font-size: 24px; }
  .btn-entrada  { background: #22c55e; color: #000; }
  .btn-pausa    { background: #f59e0b; color: #000; }
  .btn-finpausa { background: #38bdf8; color: #000; }
  .btn-salida   { background: #ef4444; color: #fff; }
  .btn-ausencia { background: #a78bfa; color: #000; }
  .btn-vacaciones { background: #06b6d4; color: #000; grid-column: 1 / -1; padding: 14px; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #162032; border-radius: 20px 20px 0 0;
    padding: 24px 20px 36px; width: 100%; max-width: 400px;
    border-top: 1px solid rgba(255,255,255,0.1);
    max-height: 85vh; overflow-y: auto;
  }
  .modal-title { font-size: 14px; font-weight: 700; color: #94a3b8; text-align: center; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
  .motivo-btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
    font-size: 15px; font-weight: 600; color: #e2e8f0;
    cursor: pointer; text-align: left;
  }
  .motivo-btn:active { background: rgba(255,255,255,0.12); }
  .motivo-btn .micon { font-size: 22px; }
  .motivo-otro-wrap input {
    width: 100%; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
    padding: 12px 14px; color: #e2e8f0; font-size: 14px;
    outline: none; font-family: inherit; margin-bottom: 10px;
  }
  .motivo-otro-wrap input::placeholder { color: #475569; }
  .btn-cancelar {
    width: 100%; background: none; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 12px; color: #64748b;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .vac-campo { margin-bottom: 16px; }
  .vac-campo label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
  .vac-campo input[type="date"] {
    width: 100%; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 14px 16px; color: #e2e8f0; font-size: 16px;
    outline: none; font-family: inherit;
  }
  .vac-campo input[type="date"]:focus { border-color: #06b6d4; }
  .vac-resumen {
    background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.3);
    border-radius: 12px; padding: 14px; text-align: center;
    font-size: 14px; color: #67e8f9; margin-bottom: 16px; display: none;
  }
  .vac-resumen.show { display: block; }
  .vac-resumen .dias { font-size: 26px; font-weight: 800; color: #06b6d4; }
  .btn-enviar-vac {
    width: 100%; background: #06b6d4; color: #000; border: none;
    border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 800;
    cursor: pointer; font-family: inherit; margin-bottom: 8px;
  }
  .btn-enviar-vac:disabled { opacity: 0.4; }
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: #162032; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 14px 24px; font-size: 14px;
    font-weight: 600; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; text-align: center; max-width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4); z-index: 200;
  }
  .toast.show { opacity: 1; }
  .toast.ok  { border-color: #22c55e; color: #22c55e; }
  .toast.err { border-color: #ef4444; color: #ef4444; }
  .toast.wait { border-color: #f59e0b; color: #f59e0b; }
  .spinner { display:none; margin-top:20px; }
  .spinner.show { display:block; }
  .spinner-ring {
    width:32px; height:32px; border:3px solid rgba(255,255,255,0.1);
    border-top-color:#f5a623; border-radius:50%;
    animation:spin .8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform:rotate(360deg) } }
  .estado-envio { font-size: 12px; color: #64748b; margin-top: 10px; min-height: 16px; text-align:center; }
</style>
</head>
<body>

<div class="empresa">🏢 Taller Auto Andalucia</div>
<div class="nombre">Azucena Navarro</div>
<div class="reloj" id="reloj">--:--:--</div>

<div class="grid">
  <button class="btn btn-entrada"  onclick="fichar('ENTRADA',null)"><span class="icon">▶</span>ENTRADA</button>
  <button class="btn btn-salida"   onclick="fichar('SALIDA',null)"><span class="icon">■</span>SALIDA</button>
  <button class="btn btn-pausa"    onclick="abrirModal('pausa')"><span class="icon">⏸</span>PAUSA</button>
  <button class="btn btn-finpausa" onclick="fichar('FIN PAUSA',null)"><span class="icon">▶</span>FIN PAUSA</button>
  <button class="btn btn-ausencia" onclick="abrirModal('ausencia')"><span class="icon">📋</span>AUSENCIA</button>
  <button class="btn btn-vacaciones" onclick="abrirModal('vacaciones')"><span class="icon">🏖</span>SOLICITAR VACACIONES</button>
</div>

<div class="spinner" id="spinner"><div class="spinner-ring"></div></div>
<div class="estado-envio" id="estadoEnvio"></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="modal-pausa">
  <div class="modal">
    <div class="modal-title">⏸ Motivo de la pausa</div>
    <button class="motivo-btn" onclick="fichar('PAUSA','Desayuno')"><span class="micon">☕</span> Desayuno</button>
    <button class="motivo-btn" onclick="fichar('PAUSA','Medico')"><span class="micon">🏥</span> Médico</button>
    <button class="motivo-btn" onclick="fichar('PAUSA','Motivo de trabajo')"><span class="micon">🔧</span> Motivo de trabajo</button>
    <div class="motivo-otro-wrap">
      <input type="text" id="otro-pausa" placeholder="Otro motivo... (escribe aqui)" />
      <button class="motivo-btn" onclick="ficharOtro('PAUSA','otro-pausa')"><span class="micon">✏️</span> Otro motivo</button>
    </div>
    <button class="btn-cancelar" onclick="cerrarModal('modal-pausa')">Cancelar</button>
  </div>
</div>

<div class="overlay" id="modal-ausencia">
  <div class="modal">
    <div class="modal-title">📋 Motivo de la ausencia</div>
    <button class="motivo-btn" onclick="fichar('AUSENCIA','Baja medica')"><span class="micon">🤒</span> Baja médica</button>
    <button class="motivo-btn" onclick="fichar('AUSENCIA','Asunto propio')"><span class="micon">📋</span> Asunto propio</button>
    <div class="motivo-otro-wrap">
      <input type="text" id="otro-ausencia" placeholder="Otro motivo... (escribe aqui)" />
      <button class="motivo-btn" onclick="ficharOtro('AUSENCIA','otro-ausencia')"><span class="micon">✏️</span> Otro motivo</button>
    </div>
    <button class="btn-cancelar" onclick="cerrarModal('modal-ausencia')">Cancelar</button>
  </div>
</div>

<div class="overlay" id="modal-vacaciones">
  <div class="modal">
    <div class="modal-title">🏖 Solicitar vacaciones</div>
    <div class="vac-campo">
      <label>📅 Fecha de inicio</label>
      <input type="date" id="vac-inicio" onchange="calcularVac()" />
    </div>
    <div class="vac-campo">
      <label>📅 Fecha de fin</label>
      <input type="date" id="vac-fin" onchange="calcularVac()" />
    </div>
    <div class="vac-resumen" id="vac-resumen">
      <div class="dias" id="vac-numDias">0</div>
      días solicitados
    </div>
    <button class="btn-enviar-vac" id="btn-enviar-vac" onclick="solicitarVac()" disabled>Enviar solicitud</button>
    <button class="btn-cancelar" onclick="cerrarModal('modal-vacaciones')">Cancelar</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqVO0eAFmiL_z876Jt-EzwMnlkxYXOnlAAwg--taPRblMO6XpPEHyvmZwbtgkY-4y9/exec";
  const ID_KEY = "azucena-navarro";

  function tick() {
    const d = new Date(), p = n => String(n).padStart(2,'0');
    document.getElementById('reloj').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);

  function abrirModal(tipo) { document.getElementById('modal-'+tipo).classList.add('show'); }
  function cerrarModal(id)  { document.getElementById(id).classList.remove('show'); }

  function fichar(tipo, motivo) {
    cerrarModal('modal-pausa');
    cerrarModal('modal-ausencia');
    enviar(tipo, motivo || '');
  }

  function ficharOtro(tipo, inputId) {
    const motivo = document.getElementById(inputId).value.trim();
    if (!motivo) { alert('Escribe el motivo antes de continuar'); return; }
    fichar(tipo, motivo);
  }

  // Hora exacta del movil en formato dd/MM/yyyy HH:mm:ss
  function horaMovil() {
    const d = new Date(), p = n => String(n).padStart(2,'0');
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+
           p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }

  // Envia con reintentos automaticos (hasta 4 intentos)
  function enviar(tipo, obs) {
    const btns = document.querySelectorAll('.btn');
    btns.forEach(b => b.disabled = true);
    document.getElementById('spinner').classList.add('show');

    const hm = horaMovil(); // hora real del clic, se mantiene en los reintentos
    const horaCorta = hm.substring(11,16);
    let intento = 0;
    const maxIntentos = 4;

    function intentarEnvio() {
      intento++;
      if (intento > 1) {
        document.getElementById('estadoEnvio').textContent = 'Reintentando... (' + intento + '/' + maxIntentos + ')';
      }

      const url = SCRIPT_URL + '?id=' + ID_KEY +
        '&tipo=' + encodeURIComponent(tipo) +
        '&obs=' + encodeURIComponent(obs) +
        '&hm=' + encodeURIComponent(hm);

      // Timeout manual de 12 segundos por intento
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 12000);

      fetch(url, { signal: ctrl.signal })
        .then(r => r.json())
        .then(res => {
          clearTimeout(tid);
          if (res.ok) {
            finalizar(true, 'Fichaje registrado a las ' + (res.hora || horaCorta));
          } else {
            finalizar(false, 'Error: ' + (res.msg || 'intentalo de nuevo'));
          }
        })
        .catch(() => {
          clearTimeout(tid);
          if (intento < maxIntentos) {
            setTimeout(intentarEnvio, 1500); // esperar 1.5s y reintentar
          } else {
            finalizar(false, 'No se pudo conectar. Comprueba tu conexion y vuelve a intentarlo.');
          }
        });
    }

    function finalizar(ok, msg) {
      document.getElementById('spinner').classList.remove('show');
      document.getElementById('estadoEnvio').textContent = '';
      btns.forEach(b => b.disabled = false);
      mostrarToast((ok ? '✅ ' : '❌ ') + msg, ok ? 'ok' : 'err');
    }

    intentarEnvio();
  }

  // ── Vacaciones ──
  function calcularVac() {
    const ini = document.getElementById('vac-inicio').value;
    const fin = document.getElementById('vac-fin').value;
    const btn = document.getElementById('btn-enviar-vac');
    const resumen = document.getElementById('vac-resumen');
    if (ini && fin) {
      const d1 = new Date(ini), d2 = new Date(fin);
      if (d2 < d1) {
        mostrarToast('La fecha de fin no puede ser anterior al inicio', 'err');
        resumen.classList.remove('show'); btn.disabled = true; return;
      }
      const dias = Math.round((d2 - d1) / 86400000) + 1;
      document.getElementById('vac-numDias').textContent = dias;
      resumen.classList.add('show'); btn.disabled = false;
    } else {
      resumen.classList.remove('show'); btn.disabled = true;
    }
  }

  function formatES(iso) {
    const [y,m,d] = iso.split('-');
    return d + '/' + m + '/' + y;
  }

  function solicitarVac() {
    const ini = document.getElementById('vac-inicio').value;
    const fin = document.getElementById('vac-fin').value;
    if (!ini || !fin) return;
    const dias = document.getElementById('vac-numDias').textContent;
    document.getElementById('btn-enviar-vac').disabled = true;
    cerrarModal('modal-vacaciones');
    document.getElementById('spinner').classList.add('show');

    const url = SCRIPT_URL + '?accion=vacaciones&id=' + ID_KEY +
      '&inicio=' + encodeURIComponent(formatES(ini)) +
      '&fin=' + encodeURIComponent(formatES(fin)) + '&dias=' + dias;

    fetch(url).then(r => r.json()).then(res => {
      document.getElementById('spinner').classList.remove('show');
      if (res.ok) {
        mostrarToast('✅ Solicitud enviada. Pendiente de aprobacion.', 'ok');
        document.getElementById('vac-inicio').value = '';
        document.getElementById('vac-fin').value = '';
        document.getElementById('vac-resumen').classList.remove('show');
      } else {
        mostrarToast('Error: ' + (res.msg||'intentalo de nuevo'), 'err');
      }
    }).catch(() => {
      document.getElementById('spinner').classList.remove('show');
      mostrarToast('Error de conexion al solicitar', 'err');
    });
  }

  function mostrarToast(msg, tipo) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + tipo;
    setTimeout(() => t.className = 'toast', 4500);
  }
</script>
</body>
</html>
